name: quality
# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Replaces the formerly-inlined quality-audit job with a thin `uses:` call
# into the scitex-ai/.github reusable workflow — same job body (derives the
# package name from this repo's own pyproject.toml automatically), now
# centrally maintained. Triggers preserved verbatim from the prior file.
#
# New required-status-check context: "quality-audit / audit"
# — may not match the OLD required-status-check contexts on develop/main
# branch protection; branch protection updated as part of this PR where
# needed.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC, after the 07:00 per-repo test runs
  workflow_dispatch:

jobs:
  quality-audit:
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit
