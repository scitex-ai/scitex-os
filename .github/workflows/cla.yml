name: CLA Assistant
# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers/permissions preserved verbatim from the prior local file.
# owner_allowlist overridden: this repo's prior hardcoded allowlist
# ("bot*,ywatanabe1989,LLEmacs") includes LLEmacs in addition to the
# reusable workflow's default ("bot*,ywatanabe1989"). owner_login and
# default_branch match the reusable workflow's defaults, so left unset.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
    secrets: inherit
