name: tests
# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Replaces the formerly-inlined pytest-matrix job with a thin `uses:` call
# into the scitex-ai/.github reusable workflow — same job body, now
# centrally maintained. Triggers preserved verbatim from the prior file.
#
# New required-status-check context: "pytest-matrix / pytest-matrix-on-ubuntu-py<X.YY>"
# — may not match the OLD required-status-check contexts on develop/main
# branch protection; branch protection updated as part of this PR where
# needed.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

jobs:
  pytest-matrix:
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit
