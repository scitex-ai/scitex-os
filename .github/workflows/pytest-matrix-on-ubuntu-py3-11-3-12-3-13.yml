name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

jobs:
  test:
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Fallback chain: prefer [all,dev] so optional-dep code paths get
          # exercised. Falls back to [dev] then plain editable so a packaging
          # hiccup doesn't strand CI.
          pip install -e ".[all,dev]" || pip install -e ".[dev]" || pip install -e .
      - name: Run tests
        run: |
          pytest tests/ --cov=src/scitex_os --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        env:
          # PRESERVE the codecov gitconfig-race fix (os PR #22): give the
          # codecov-action its own per-job HOME so its
          # `git config --global --add safe.directory` write can never collide
          # on a shared ~/.gitconfig lock ("could not lock config file ... :
          # File exists" -> exit 255). Harmless on ephemeral ubuntu-latest;
          # essential if this job is ever moved onto a shared self-hosted HOME.
          HOME: ${{ runner.temp }}/codecov-home-${{ matrix.python-version }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          # The repo is owned by the runner user; the safe.directory write only
          # exists to satisfy git's dubious-ownership check, which does not
          # apply here. Skipping it removes the shared-gitconfig write entirely.
          disable_safe_directory: true
